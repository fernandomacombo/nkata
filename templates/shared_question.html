<!doctype html>
<html lang="{% if english %}en{% else %}pt{% endif %}">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ question }} · NKATA</title>
<meta property="og:title" content="{{ question }}">
<meta property="og:description" content="{{ options|join:' · ' }}">
<meta property="og:image" content="https://www.nkata.date/social-preview.png">
<style>body{margin:0;background:#f6f1eb;color:#312529;font:1rem/1.5 system-ui}main{max-width:32rem;margin:10vh auto;padding:2rem;background:#fffaf5;border-radius:1rem}h1{font-family:Georgia,serif}a{color:#81273e}</style>
<main><b>NKATA · {% if english %}Question of the day{% else %}Pergunta do dia{% endif %}</b>
<h1>{{ question }}</h1><p>{{ options|join:" · " }}</p>
<a href="/">{% if english %}Visit NKATA{% else %}Visitar o NKATA{% endif %}</a></main>
</html>
