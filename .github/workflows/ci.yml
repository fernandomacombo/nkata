name: NKATA CI

on:
  push:
    branches: [main, opcao-a-base-react-django, integracao/nkata-completo]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test
      - name: Validar configuração de produção
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-only-9fG7vQ2mK8xR4sN6pL3wC5aD1hJ0uT9yB7eV2zQ8kM4cX6nP"
          DJANGO_ALLOWED_HOSTS: "nkata-ci.example.test"
          NKATA_FRONTEND_URL: "https://nkata-ci.example.test"
          DATABASE_URL: "postgresql://nkata:test@127.0.0.1:5432/nkata"
          DJANGO_DB_SSL_REQUIRED: "False"
          REDIS_URL: "redis://127.0.0.1:6379/0"
          NKATA_STORAGE_BUCKET: "nkata-ci-private"
          CORS_ALLOW_ALL_ORIGINS: "False"
          CORS_ALLOWED_ORIGINS: "https://nkata-ci.example.test"
          CSRF_TRUSTED_ORIGINS: "https://nkata-ci.example.test"
          DJANGO_EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
          DJANGO_EMAIL_HOST: "smtp.example.test"
          DJANGO_EMAIL_HOST_USER: "nkata-ci"
          DJANGO_EMAIL_HOST_PASSWORD: "ci-only-password"
          DJANGO_DEFAULT_FROM_EMAIL: "NKATA <no-reply@example.test>"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:api-runtime
      - run: npm run test:nkata-id
      - run: npm run build
      - run: npm audit --audit-level=high
